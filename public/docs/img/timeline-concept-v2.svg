<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="AVON timeline concept v2 - data-driven wear bands and fail pins">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="60%" stop-color="#071110"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84f1b4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="wearSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#a100ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a100ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="wearToFail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.12"/>
      <stop offset="72%" stop-color="#a100ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3131" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMint" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCoral" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
      .display { font-family: Orbitron, Satoshi, system-ui, sans-serif; }
      .body { font-family: Satoshi, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#stage)"/>
  <circle cx="200" cy="760" r="240" fill="#84f1b4" opacity="0.035"/>
  <circle cx="1180" cy="820" r="260" fill="#00b4d8" opacity="0.04"/>

  <text x="64" y="70" class="display" fill="#ffffff" font-size="26" font-weight="800" letter-spacing="-0.4">AVON - timeline concept v2</text>
  <text x="64" y="98" class="body" fill="#96a8a0" font-size="15">Same rules, any week. Marks come from event onset / end / category - nothing placed by hand.</text>

  <!-- Rule chips -->
  <g transform="translate(64,124)">
    <rect x="0" y="0" width="248" height="34" rx="10" fill="rgba(161,0,255,0.1)" stroke="rgba(161,0,255,0.28)"/>
    <text x="14" y="22" class="body" fill="#c9a0ff" font-size="12" font-weight="600">wear = band under rail (onset to end)</text>

    <rect x="260" y="0" width="220" height="34" rx="10" fill="rgba(255,49,49,0.1)" stroke="rgba(255,49,49,0.28)"/>
    <text x="274" y="22" class="body" fill="#ff8a8a" font-size="12" font-weight="600">fail / leak = same pin family</text>

    <rect x="492" y="0" width="290" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="506" y="22" class="body" fill="#96a8a0" font-size="12" font-weight="600">wear + later fail on same asset = one link</text>
  </g>

  <!-- EXAMPLE A: sparse week -->
  <text x="64" y="210" class="body" fill="#667870" font-size="11" font-weight="700" letter-spacing="1.4">EXAMPLE A - SPARSE WEEK (few events, long wear)</text>
  <g filter="url(#soft)">
    <rect x="48" y="224" width="1344" height="118" rx="22" fill="rgba(6,16,24,0.92)" stroke="rgba(0,180,216,0.18)"/>
  </g>

  <text x="72" y="258" class="body" fill="#96a8a0" font-size="10" font-weight="700" letter-spacing="1">FRI - OCT 10</text>
  <text x="72" y="290" class="mono" fill="#ffffff" font-size="28" font-weight="700">09:14</text>
  <g transform="translate(72,306)">
    <circle cx="4" cy="0" r="3" fill="#00b4d8"/>
    <text x="12" y="4" class="body" fill="#96a8a0" font-size="11">replay</text>
  </g>

  <g transform="translate(220,250)">
    <text x="0" y="0" class="mono" fill="#667870" font-size="10">Tue</text>
    <text x="500" y="0" class="mono" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Fri 09:14</text>
    <text x="1000" y="0" class="mono" fill="#667870" font-size="10" text-anchor="end">Sun</text>

    <!-- under-rail wear lanes -->
    <rect x="90" y="40" width="210" height="10" rx="5" fill="url(#wearSoft)"/>
    <rect x="620" y="40" width="160" height="10" rx="5" fill="url(#wearToFail)"/>

    <!-- rail above bands -->
    <rect x="0" y="28" width="1000" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="28" width="500" height="6" rx="3" fill="url(#fill)"/>

    <!-- past fail, quieter -->
    <g transform="translate(280,31)" opacity="0.5">
      <circle cx="0" cy="-12" r="4.5" fill="#ff3131"/>
      <circle cx="0" cy="-12" r="4.5" fill="none" stroke="#050807" stroke-width="1.5"/>
      <line x1="0" y1="-7" x2="0" y2="-1" stroke="#ff3131" stroke-width="1.4" opacity="0.7"/>
    </g>

    <!-- amber leak pin (same family) -->
    <g transform="translate(410,31)">
      <circle cx="0" cy="-12" r="4.5" fill="#f4a261"/>
      <circle cx="0" cy="-12" r="4.5" fill="none" stroke="#050807" stroke-width="1.5"/>
      <line x1="0" y1="-7" x2="0" y2="-1" stroke="#f4a261" stroke-width="1.4" opacity="0.7"/>
    </g>

    <!-- linked fail pin at end of wearToFail -->
    <g transform="translate(780,31)" filter="url(#glowCoral)">
      <circle cx="0" cy="-14" r="8" fill="none" stroke="#ff3131" stroke-opacity="0.25"/>
      <circle cx="0" cy="-14" r="5" fill="#ff3131"/>
      <circle cx="0" cy="-14" r="5" fill="none" stroke="#050807" stroke-width="1.8"/>
      <line x1="0" y1="-8" x2="0" y2="-1" stroke="#ff3131" stroke-width="1.4" opacity="0.75"/>
    </g>

    <!-- playhead -->
    <g transform="translate(500,31)" filter="url(#glowMint)">
      <rect x="-1" y="-16" width="2" height="32" rx="1" fill="#fff"/>
      <circle cx="0" cy="0" r="8" fill="url(#fill)" stroke="#050807" stroke-width="2"/>
    </g>

    <!-- hover chip example (data label, not hardcoded copy) -->
    <g transform="translate(690, -8)">
      <rect x="0" y="0" width="168" height="26" rx="8" fill="rgba(8,14,18,0.95)" stroke="rgba(255,49,49,0.35)"/>
      <text x="12" y="17" class="mono" fill="#e4ece8" font-size="11">S3_PUMP_A - wearing to fail</text>
    </g>
  </g>

  <g transform="translate(1260,250)">
    <rect x="0" y="0" width="108" height="32" rx="11" fill="#84f1b4"/>
    <text x="54" y="21" class="body" fill="#050807" font-size="12" font-weight="700" text-anchor="middle">Next critical</text>
    <rect x="0" y="42" width="108" height="30" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="54" y="61" class="body" fill="#e4ece8" font-size="11" font-weight="600" text-anchor="middle">Back to now</text>
  </g>

  <!-- EXAMPLE B: dense week -->
  <text x="64" y="400" class="body" fill="#667870" font-size="11" font-weight="700" letter-spacing="1.4">EXAMPLE B - DENSE WEEK (many short events, same rules)</text>
  <g filter="url(#soft)">
    <rect x="48" y="414" width="1344" height="118" rx="22" fill="rgba(6,16,24,0.92)" stroke="rgba(0,180,216,0.18)"/>
  </g>

  <text x="72" y="448" class="body" fill="#96a8a0" font-size="10" font-weight="700" letter-spacing="1">SAT - OCT 11</text>
  <text x="72" y="480" class="mono" fill="#ffffff" font-size="28" font-weight="700">18:40</text>
  <g transform="translate(72,496)">
    <circle cx="4" cy="0" r="3" fill="#84f1b4"/>
    <text x="12" y="4" class="body" fill="#96a8a0" font-size="11">live end</text>
  </g>

  <g transform="translate(220,440)">
    <text x="0" y="0" class="mono" fill="#667870" font-size="10">Tue</text>
    <text x="780" y="0" class="mono" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Sat 18:40</text>
    <text x="1000" y="0" class="mono" fill="#667870" font-size="10" text-anchor="end">Sun</text>

    <!-- several short wear bands under rail - varying lengths from data -->
    <rect x="40" y="40" width="48" height="9" rx="4.5" fill="#a100ff" opacity="0.22"/>
    <rect x="160" y="40" width="90" height="9" rx="4.5" fill="#a100ff" opacity="0.22"/>
    <rect x="310" y="40" width="36" height="9" rx="4.5" fill="url(#wearToFail)"/>
    <rect x="470" y="40" width="70" height="9" rx="4.5" fill="#a100ff" opacity="0.2"/>
    <rect x="620" y="40" width="55" height="9" rx="4.5" fill="#a100ff" opacity="0.18"/>
    <rect x="860" y="40" width="42" height="9" rx="4.5" fill="#a100ff" opacity="0.16"/>

    <rect x="0" y="28" width="1000" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="28" width="780" height="6" rx="3" fill="url(#fill)"/>

    <!-- cluster of fail pins - positions from onset values -->
    <g opacity="0.55">
      <g transform="translate(120,31)"><circle cx="0" cy="-11" r="4" fill="#ff3131"/><circle cx="0" cy="-11" r="4" fill="none" stroke="#050807" stroke-width="1.3"/></g>
      <g transform="translate(250,31)"><circle cx="0" cy="-11" r="4" fill="#ff3131"/><circle cx="0" cy="-11" r="4" fill="none" stroke="#050807" stroke-width="1.3"/></g>
    </g>
    <g transform="translate(346,31)">
      <circle cx="0" cy="-12" r="4.5" fill="#ff3131"/>
      <circle cx="0" cy="-12" r="4.5" fill="none" stroke="#050807" stroke-width="1.4"/>
    </g>
    <g transform="translate(540,31)" opacity="0.7">
      <circle cx="0" cy="-11" r="4" fill="#ff3131"/>
      <circle cx="0" cy="-11" r="4" fill="none" stroke="#050807" stroke-width="1.3"/>
    </g>
    <g transform="translate(700,31)" opacity="0.85" filter="url(#glowCoral)">
      <circle cx="0" cy="-13" r="7" fill="none" stroke="#ff3131" stroke-opacity="0.22"/>
      <circle cx="0" cy="-13" r="4.5" fill="#ff3131"/>
      <circle cx="0" cy="-13" r="4.5" fill="none" stroke="#050807" stroke-width="1.5"/>
    </g>
    <!-- amber leaks -->
    <g transform="translate(200,31)"><circle cx="0" cy="-11" r="4" fill="#f4a261"/><circle cx="0" cy="-11" r="4" fill="none" stroke="#050807" stroke-width="1.3"/></g>
    <g transform="translate(900,31)"><circle cx="0" cy="-11" r="4" fill="#f4a261"/><circle cx="0" cy="-11" r="4" fill="none" stroke="#050807" stroke-width="1.3"/></g>

    <g transform="translate(780,31)" filter="url(#glowMint)">
      <rect x="-1" y="-16" width="2" height="32" rx="1" fill="#fff"/>
      <circle cx="0" cy="0" r="8" fill="url(#fill)" stroke="#050807" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(1260,440)">
    <rect x="0" y="0" width="108" height="32" rx="11" fill="#84f1b4"/>
    <text x="54" y="21" class="body" fill="#050807" font-size="12" font-weight="700" text-anchor="middle">Next critical</text>
    <rect x="0" y="42" width="108" height="30" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="54" y="61" class="body" fill="#e4ece8" font-size="11" font-weight="600" text-anchor="middle">Back to now</text>
  </g>

  <!-- Mapping panel: how data drives marks -->
  <text x="64" y="590" class="body" fill="#667870" font-size="11" font-weight="700" letter-spacing="1.4">DATA MAPPING (not art direction)</text>
  <g>
    <rect x="48" y="604" width="1344" height="210" rx="20" fill="rgba(6,16,24,0.88)" stroke="rgba(255,255,255,0.08)"/>

    <!-- table-like rows -->
    <text x="80" y="640" class="mono" fill="#667870" font-size="11">category</text>
    <text x="280" y="640" class="mono" fill="#667870" font-size="11">fields used</text>
    <text x="620" y="640" class="mono" fill="#667870" font-size="11">render</text>
    <text x="980" y="640" class="mono" fill="#667870" font-size="11">note</text>
    <line x1="80" y1="652" x2="1350" y2="652" stroke="rgba(255,255,255,0.08)"/>

    <circle cx="88" cy="678" r="5" fill="#a100ff" opacity="0.7"/>
    <text x="104" y="682" class="body" fill="#c9a0ff" font-size="13" font-weight="600">pump_degradation</text>
    <text x="280" y="682" class="mono" fill="#96a8a0" font-size="12">onset, end</text>
    <text x="620" y="682" class="body" fill="#e4ece8" font-size="13">violet band under rail</text>
    <text x="980" y="682" class="body" fill="#667870" font-size="12">width = end - onset</text>

    <circle cx="88" cy="718" r="5" fill="#ff3131"/>
    <text x="104" y="722" class="body" fill="#ff8a8a" font-size="13" font-weight="600">pump_failure</text>
    <text x="280" y="722" class="mono" fill="#96a8a0" font-size="12">onset [, prior wear]</text>
    <text x="620" y="722" class="body" fill="#e4ece8" font-size="13">coral pin (+ link if same asset)</text>
    <text x="980" y="722" class="body" fill="#667870" font-size="12">pulse only if upcoming / live</text>

    <circle cx="88" cy="758" r="5" fill="#f4a261"/>
    <text x="104" y="762" class="body" fill="#f4a261" font-size="13" font-weight="600">pipeline_leak</text>
    <text x="280" y="762" class="mono" fill="#96a8a0" font-size="12">onset</text>
    <text x="620" y="762" class="body" fill="#e4ece8" font-size="13">amber pin (same glyph)</text>
    <text x="980" y="762" class="body" fill="#667870" font-size="12">color carries meaning</text>

    <text x="80" y="792" class="body" fill="#667870" font-size="12">Resolved wear fades. Failures stay readable during replay. Hover shows facility id from data.</text>
  </g>
</svg>
