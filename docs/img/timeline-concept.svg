<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="AVON timeline concept: wear as bands, failure as pins">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="55%" stop-color="#071110"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84f1b4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="wear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a100ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a100ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wearHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#a100ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3131" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMint" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCoral" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
      .display { font-family: Orbitron, Satoshi, system-ui, sans-serif; }
      .body { font-family: Satoshi, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="810" fill="url(#stage)"/>
  <circle cx="180" cy="680" r="220" fill="#84f1b4" opacity="0.04"/>
  <circle cx="420" cy="760" r="280" fill="#00b4d8" opacity="0.05"/>

  <text x="72" y="88" class="display" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">AVON - timeline concept</text>
  <text x="72" y="118" class="body" fill="#96a8a0" font-size="16">Wear is a quiet band. Failure is a sharp pin. Linked wear to fail is one mark.</text>

  <g>
    <path d="M420 470 L420 520" stroke="#a100ff" stroke-width="1.5" opacity="0.55"/>
    <circle cx="420" cy="470" r="3" fill="#a100ff"/>
    <text x="432" y="464" class="body" fill="#c9a0ff" font-size="13" font-weight="600">wear band</text>
    <text x="432" y="482" class="body" fill="#667870" font-size="12">duration, no pulse</text>

    <path d="M710 450 L710 520" stroke="#ff3131" stroke-width="1.5" opacity="0.55"/>
    <circle cx="710" cy="450" r="3" fill="#ff3131"/>
    <text x="722" y="444" class="body" fill="#ff8a8a" font-size="13" font-weight="600">wear to fail</text>
    <text x="722" y="462" class="body" fill="#667870" font-size="12">one continuous story</text>

    <path d="M980 470 L980 520" stroke="#ff3131" stroke-width="1.5" opacity="0.55"/>
    <circle cx="980" cy="470" r="3" fill="#ff3131"/>
    <text x="992" y="464" class="body" fill="#ff8a8a" font-size="13" font-weight="600">fail pin</text>
    <text x="992" y="482" class="body" fill="#667870" font-size="12">point - pulses</text>
  </g>

  <g filter="url(#soft)">
    <rect x="48" y="540" width="1344" height="132" rx="24" fill="rgba(6,16,24,0.94)" stroke="rgba(0,180,216,0.22)" stroke-width="1"/>
  </g>

  <text x="76" y="578" class="body" fill="#96a8a0" font-size="11" font-weight="700" letter-spacing="1.2">WED - OCT 8</text>
  <text x="76" y="618" class="mono" fill="#ffffff" font-size="34" font-weight="700">14:32</text>
  <g transform="translate(76,636)">
    <circle cx="4" cy="0" r="3.5" fill="#00b4d8"/>
    <text x="14" y="4" class="body" fill="#96a8a0" font-size="12" font-weight="600">replay</text>
  </g>

  <g transform="translate(230,560)">
    <text x="0" y="0" class="mono" fill="#667870" font-size="11">Tue 08:00</text>
    <text x="470" y="0" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Wed 14:32</text>
    <text x="980" y="0" class="mono" fill="#667870" font-size="11" text-anchor="end">Sun 23:59</text>

    <rect x="0" y="42" width="980" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="0" y="42" width="540" height="8" rx="4" fill="url(#fill)"/>

    <rect x="120" y="38" width="110" height="16" rx="8" fill="url(#wear)"/>
    <rect x="120" y="38" width="110" height="16" rx="8" fill="none" stroke="#a100ff" stroke-opacity="0.35" stroke-width="1"/>

    <rect x="580" y="38" width="130" height="16" rx="8" fill="url(#wearHot)"/>
    <rect x="580" y="38" width="130" height="16" rx="8" fill="none" stroke="#a100ff" stroke-opacity="0.25" stroke-width="1"/>

    <g transform="translate(710,46)" filter="url(#glowCoral)">
      <line x1="0" y1="-14" x2="0" y2="-4" stroke="#ff3131" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="-18" r="9" fill="none" stroke="#ff3131" stroke-opacity="0.28" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="5" fill="#ff3131"/>
      <circle cx="0" cy="-18" r="5" fill="none" stroke="#050807" stroke-width="2"/>
    </g>

    <g transform="translate(320,46)" opacity="0.55">
      <line x1="0" y1="-12" x2="0" y2="-3" stroke="#ff3131" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="-16" r="4.5" fill="#ff3131"/>
      <circle cx="0" cy="-16" r="4.5" fill="none" stroke="#050807" stroke-width="1.5"/>
    </g>

    <g transform="translate(860,46)" filter="url(#glowCoral)">
      <line x1="0" y1="-14" x2="0" y2="-4" stroke="#ff3131" stroke-width="1.5" opacity="0.75"/>
      <circle cx="0" cy="-18" r="11" fill="none" stroke="#ff3131" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="5.5" fill="#ff3131"/>
      <circle cx="0" cy="-18" r="5.5" fill="none" stroke="#050807" stroke-width="2"/>
    </g>

    <g transform="translate(470,28)">
      <path d="M0 -7 L7 0 L0 7 L-7 0 Z" fill="#f4a261" stroke="#050807" stroke-width="1.5"/>
    </g>

    <rect x="900" y="40" width="55" height="12" rx="6" fill="#a100ff" opacity="0.22"/>
    <rect x="900" y="40" width="55" height="12" rx="6" fill="none" stroke="#a100ff" stroke-opacity="0.3" stroke-width="1"/>

    <g transform="translate(540,46)" filter="url(#glowMint)">
      <rect x="-1" y="-18" width="2" height="36" rx="1" fill="#ffffff"/>
      <circle cx="0" cy="0" r="9" fill="url(#fill)" stroke="#050807" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#84f1b4" stroke-opacity="0.35" stroke-width="4"/>
    </g>

    <g transform="translate(0,78)">
      <circle cx="5" cy="0" r="4" fill="#ff3131"/>
      <text x="14" y="4" class="body" fill="#96a8a0" font-size="12">fail</text>

      <rect x="58" y="-4" width="18" height="8" rx="4" fill="#a100ff" opacity="0.55"/>
      <text x="84" y="4" class="body" fill="#96a8a0" font-size="12">wear</text>

      <path d="M138 -6 L144 0 L138 6 L132 0 Z" fill="#f4a261"/>
      <text x="152" y="4" class="body" fill="#96a8a0" font-size="12">leak</text>
    </g>
  </g>

  <g transform="translate(1248,568)">
    <rect x="0" y="0" width="118" height="36" rx="12" fill="#84f1b4"/>
    <text x="59" y="23" class="body" fill="#050807" font-size="13" font-weight="700" text-anchor="middle">Next critical</text>
    <rect x="0" y="48" width="118" height="34" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="59" y="70" class="body" fill="#e4ece8" font-size="12" font-weight="600" text-anchor="middle">Back to now</text>
  </g>

  <text x="72" y="730" class="body" fill="#667870" font-size="13">Past marks fade - live wear stays soft - only failure pulses</text>
</svg>
